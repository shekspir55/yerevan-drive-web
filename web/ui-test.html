<!doctype html>
<html><head><meta charset="utf-8"><title>YD UI test</title>
<style>html,body{margin:0;background:#222}canvas{display:block;width:1024px;height:768px}#err{position:fixed;left:0;top:0;color:#f88;font:12px monospace;white-space:pre}</style>
</head><body><canvas id="c"></canvas><div id="err"></div>
<script src="three.min.js"></script><script src="formats.js"></script><script src="physics-orig.js"></script><script src="render-orig.js"></script><script src="car.js"></script><script src="ui-orig.js"></script>
<script>
// ui-test.html?screen=main|single|network|options|credits|dialog|boot|loading|hud  [&mx=..&my=.. cursor in NDC] [&hover=itemId] [&preview=1] [&t=seconds]
(async () => {
  const q = new URLSearchParams(location.search), screen = q.get('screen') || 'main';
  try {
    const vfs = new YD.VFS();
    if (q.has('sx')) YDUI.spriteShift = [+q.get('sx'), +q.get('sy')];
    const colors = q.get('colors') ? q.get('colors').split(';').map(c => c.split(',').map(Number)) : undefined;
    const ui = await YDUI.create({ canvas: document.getElementById('c'), vfs, preview: q.get('preview') === '1', settings: colors ? { colors } : undefined });
    const num = (k, d) => q.has(k) ? +q.get(k) : d;
    const o = { t: num('t', 5.3), mx: num('mx', 2), my: num('my', 2), splash: num('splash', 3), progress: num('progress', 0.1), rpm: num('rpm', 3200), speed: num('speed', 25), gear: num('gear', 3) };
    if (q.get('hover')) { const id = +q.get('hover'); window.__hover = id; }
    const paint = () => {
      ui.renderStatic(screen, o);
      if (q.get('hover')) { const sc = ui.cur; const it = sc.find(+q.get('hover')); if (it) { it.hover = true; sc.focus = sc.focusTop = it; sc.update(0.5); sc.update(0.5); ui.draw(); } }
    };
    paint();
    if (ui.previewImpl) {                                           // the 3D preview loads the car asynchronously: wait, then repaint
      const t0 = Date.now();
      await new Promise(r => (function w() { if ((ui.previewImpl.model) || Date.now() - t0 > 30000) r(); else { paint(); setTimeout(w, 150); } })());
      paint();
    }
    window.UI = ui;
  } catch (e) { document.getElementById('err').textContent = 'ERROR ' + (e.stack || e); }
  window.READY = true;
})();
</script></body></html>
