<!doctype html><meta charset="utf-8"><body style="margin:0;background:#444"><canvas id="c" width="1080" height="540"></canvas>
<script src="three.min.js"></script><script src="formats.js"></script><script src="world.js"></script>
<script>
(async()=>{ const vfs=new YD.VFS(); const cit=YDWorld.parseCit(await vfs.bytes('yerevan.cit'));
 const ts=await YD.TexSet.load(vfs,'Graph/citstdmat.tex'); const t=await ts.get('map.dds'); const img=t.image;
 const c=document.getElementById('c'), g=c.getContext('2d'); const id=g.createImageData(img.width,img.height); id.data.set(img.data); g.putImageData(id,0,0); g.putImageData(id,540,0);
 let xmin=1e9,xmax=-1e9,zmin=1e9,zmax=-1e9; const lines=[];
 cit.blocks.forEach(b=>b.paths.forEach(p=>{ const a=[]; for(let i=0;i<p.pts.length;i+=3){ const x=p.pts[i], z=p.pts[i+2]; a.push([x,z]); xmin=Math.min(xmin,x);xmax=Math.max(xmax,x);zmin=Math.min(zmin,z);zmax=Math.max(zmax,z);} lines.push(a); }));
 const mx0=190,mx1=372,my0=30,my1=412;
 const draw=(ox,flip,col)=>{ g.strokeStyle=col; g.lineWidth=1; g.beginPath(); for(const a of lines){ a.forEach(([x,z],i)=>{ const px=ox+mx0+(x-xmin)/(xmax-xmin)*(mx1-mx0); const t=(z-zmin)/(zmax-zmin); const py=flip? my1-t*(my1-my0) : my0+t*(my1-my0); i?g.lineTo(px,py):g.moveTo(px,py);}); } g.stroke(); };
 draw(0,false,'#f00'); draw(540,true,'#00f');
 window.INFO={xmin,xmax,zmin,zmax}; document.title=JSON.stringify(window.INFO); window.READY=true; })();
</script>
